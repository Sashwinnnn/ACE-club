<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Ace Club Portal</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --accent-hover: #0ea5e9;
            --input-bg: #0f172a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 2rem;
            line-height: 1.6;
        }

        .container {
            max-width: 650px;
            width: 100%;
            background-color: var(--card-bg);
            padding: 3rem 2rem;
            border-radius: 16px;
            border: 1px solid #334155;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            margin-bottom: 2rem;
        }

        .header-area {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .logo {
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 1rem;
        }

        h1 {
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 1rem;
        }

        p {
            color: var(--text-muted);
            font-size: 1.05rem;
        }

        /* Form Styling */
        form {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            text-align: left;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        label {
            font-weight: 600;
            font-size: 0.95rem;
            color: var(--text-main);
        }

        input, select, textarea {
            background-color: var(--input-bg);
            border: 1px solid #334155;
            color: var(--text-main);
            padding: 0.75rem;
            border-radius: 8px;
            font-size: 1rem;
            width: 100%;
        }

        input:focus, select:focus, textarea:focus {
            outline: 2px solid var(--accent);
            border-color: transparent;
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .submit-btn {
            background-color: var(--accent);
            color: #0f172a;
            border: none;
            font-weight: 700;
            font-size: 1.1rem;
            padding: 1rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 14px rgba(56, 189, 248, 0.3);
            margin-top: 1rem;
            text-align: center;
        }

        .submit-btn:hover {
            background-color: var(--accent-hover);
            transform: translateY(-2px);
        }

        footer {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-area">
            <div class="logo">Ace Club ♦</div>
            <h1>Request a Tutoring Session</h1>
            <p>Fill out your details below to instantly generate your structured request for our Discord team.</p>
        </div>
        
        <form id="requestForm">
            <div class="form-group">
                <label for="studentName">Your Name</label>
                <input type="text" id="studentName" placeholder="e.g., Alex Rivera" required>
            </div>

            <div class="form-group">
                <label for="subject">Subject Needed</label>
                <select id="subject" required>
                    <option value="" disabled selected>Select a subject...</option>
                    <option value="Mathematics">Mathematics (Calculus/Stats)</option>
                    <option value="Sciences">Sciences (Chemistry/Physics/Biology)</option>
                    <option value="Computer Science">Computer Science (Python/Java/Web Dev)</option>
                    <option value="English & Writing">English & Writing Composition</option>
                </select>
            </div>

            <div class="form-group">
                <label for="details">Specific Topic or Assignment Details</label>
                <textarea id="details" placeholder="e.g., Reviewing AP Calculus Chapter 4 implicit differentiation homework problems." required></textarea>
            </div>

            <div class="form-group">
                <label for="availability">Your General Availability</label>
                <input type="text" id="availability" placeholder="e.g., Mondays & Wednesdays after 4:00 PM" required>
            </div>

            <button type="submit" class="submit-btn">Launch Request Tool</button>
        </form>
    </div>

    <footer>
        &copy; 2026 Ace Club. All rights reserved.
    </footer>

    <script>
        document.getElementById('requestForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Grab the form input values
            const name = document.getElementById('studentName').value;
            const subject = document.getElementById('subject').value;
            const details = document.getElementById('details').value;
            const availability = document.getElementById('availability').value;
            
            // Format a clean, uniform text string
            const messageBlock = `--- ACE CLUB REQUEST ---\nStudent: ${name}\nSubject: ${subject}\nDetails: ${details}\nAvailability: ${availability}\n------------------------`;
            
            // Copy the formatted data to the user's clipboard automatically
            navigator.clipboard.writeText(messageBlock).then(() => {
                alert("Request info formatted and copied to clipboard! Your browser will now open Discord. Just paste the text straight into your open ticket room.");
                // Redirects them right into your Discord invite link
                window.open("https://discord.gg/NUdUuqc9", "_blank");
            }).catch(err => {
                console.error("Clipboard error: ", err);
                alert("Form completed! Please copy your text and paste it into the Discord ticket.");
            });
        });
    </script>

</body>
</html>
