<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ace Club - Book a Session</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #a855f7; 
            --accent-hover: #9333ea;
            --input-bg: #0f172a;
            --success: #10b981;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            padding: 2rem 1rem; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
        }

        .form-container {
            max-width: 550px; 
            width: 100%; 
            background-color: var(--card-bg);
            padding: 2.5rem; 
            border-radius: 16px; 
            border: 1px solid #334155;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        }

        h1 { font-size: 2rem; color: var(--text-main); margin-bottom: 0.5rem; font-weight: 700; text-align: center; }
        .subtitle { color: var(--text-muted); text-align: center; margin-bottom: 2rem; font-size: 0.95rem; }

        .form-group { display: flex; flex-direction: column; gap: 0.5rem; margin-bottom: 1.5rem; }
        label { font-weight: 600; font-size: 0.9rem; color: #e2e8f0; }
        
        input, select, textarea {
            background-color: var(--input-bg); 
            border: 1px solid #334155; 
            color: var(--text-main);
            padding: 0.75rem; 
            border-radius: 8px; 
            font-size: 1rem; 
            width: 100%;
            transition: border-color 0.2s;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--accent);
        }

        textarea { resize: vertical; min-height: 100px; }

        .submit-btn {
            background-color: var(--accent); 
            color: white; 
            border: none; 
            font-weight: 700;
            padding: 0.85rem; 
            border-radius: 8px; 
            cursor: pointer; 
            transition: background-color 0.2s;
            width: 100%;
            font-size: 1rem;
            margin-top: 0.5rem;
        }
        .submit-btn:hover { background-color: var(--accent-hover); }

        #statusMessage {
            text-align: center;
            margin-top: 1rem;
            font-size: 0.95rem;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="form-container">
        <h1>Ace Club Tutoring</h1>
        <p class="subtitle">Submit your request and our admin engine will map your session.</p>

        <form id="requestForm">
            <div class="form-group">
                <label for="studentName">Your Full Name</label>
                <input type="text" id="studentName" placeholder="e.g. Alex Morgan" required>
            </div>

            <div class="form-group">
                <label for="subjectSelect">Subject Stream</label>
                <select id="subjectSelect" required>
                    <option value="" disabled selected>Select a subject...</option>
                    <option value="Mathematics">Mathematics</option>
                    <option value="Computer Science">Computer Science</option>
                    <option value="Data Science">Data Science</option>
                    <option value="Physics">Physics</option>
                    <option value="Chemistry">Chemistry</option>
                </select>
            </div>

            <div class="form-group">
                <label for="topicDetails">What specific topics do you need help with?</label>
                <textarea id="topicDetails" placeholder="e.g. Preparing for midterm exam covering derivatives and integration loops..." required></textarea>
            </div>

            <div class="form-group">
                <label for="availabilityInput">When are you available? (Plain English)</label>
                <input type="text" id="availabilityInput" placeholder="e.g. monday after 4 pm, tomorrow around 2, next friday at 11am" required>
            </div>

            <button type="submit" class="submit-btn">Submit Tutoring Request</button>
        </form>

        <div id="statusMessage"></div>
    </div>

    <script>
        // --- PASTE YOUR FIREBASE KEYS HERE ---
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };
        // ----------------------------------------------

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // Form Submission Handler
        document.getElementById('requestForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const submitBtn = document.querySelector('.submit-btn');
            const statusMsg = document.getElementById('statusMessage');

            // Collect and Sanitize inputs (Stripping quotes to preserve clean JSON queries)
            const rawName = document.getElementById('studentName').value;
            const rawSubject = document.getElementById('subjectSelect').value;
            const rawDetails = document.getElementById('topicDetails').value;
            const rawAvailability = document.getElementById('availabilityInput').value;

            const cleanName = rawName.replace(/['"]/g, "").trim();
            const cleanSubject = rawSubject.replace(/['"]/g, "").trim();
            const cleanDetails = rawDetails.replace(/['"]/g, "").trim();
            const cleanAvailability = rawAvailability.replace(/['"]/g, "").trim();

            // Freeze button UI during flight
            submitBtn.disabled = true;
            submitBtn.innerText = "Transmitting to Cloud Stream...";
            statusMsg.innerText = "";

            // Push object directly to Firestore collection
            db.collection("requests").add({
                name: cleanName,
                subject: cleanSubject,
                details: cleanDetails,
                availability: cleanAvailability,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            })
            .then(() => {
                // Success Handling
                statusMsg.style.color = var(--success);
                statusMsg.innerText = "✓ Request logged successfully! Our team is processing your slot.";
                document.getElementById('requestForm').reset();
            })
            .catch((error) => {
                // Error Handling
                console.error("Firestore Upload Exception: ", error);
                statusMsg.style.color = "#ef4444";
                statusMsg.innerText = "⚠️ Cloud transaction failed. Please check network connection.";
            })
            .finally(() => {
                // Restore button state
                submitBtn.disabled = false;
                submitBtn.innerText = "Submit Tutoring Request";
            });
        });
    </script>
</body>
</html>
